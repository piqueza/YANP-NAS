# Debian's ports.conf supplies Listen 80 and Listen 443 (with mod_ssl enabled).
<VirtualHost *:80>
    ServerName yanp-nas.local
    RewriteEngine On
    # Preserve the IP/hostname used by the client; omit an explicit HTTP port.
    RewriteCond %{HTTP_HOST} "^(\[[0-9A-Fa-f:.]+\]|[A-Za-z0-9.-]+)(?::80)?$"
    RewriteRule ^ https://%1%{REQUEST_URI} [R=308,L]
    RewriteRule ^ - [R=400,L]
    ErrorLog ${APACHE_LOG_DIR}/yanp-nas-error.log
    CustomLog ${APACHE_LOG_DIR}/yanp-nas-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName yanp-nas.local
    DocumentRoot /opt/yanp-nas/web/public
    SSLEngine on
    SSLCertificateFile /etc/yanp-nas/tls.crt
    SSLCertificateKeyFile /etc/yanp-nas/tls.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Frame-Options "DENY"
    Header always set X-Content-Type-Options "nosniff"
    <Directory /opt/yanp-nas/web/public>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        <FilesMatch "\.(sql|json|py|ini|log|bak)$">
            Require all denied
        </FilesMatch>
    </Directory>
    php_admin_flag display_errors Off
    php_admin_flag log_errors On
    php_admin_flag expose_php Off
    php_admin_value session.save_path /var/lib/yanp-nas/sessions
    php_admin_value max_execution_time 110
    php_admin_value upload_max_filesize 1M
    php_admin_value post_max_size 128K
    php_admin_value memory_limit 256M
    php_admin_value disable_functions "exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec"
    ErrorLog ${APACHE_LOG_DIR}/yanp-nas-error.log
    CustomLog ${APACHE_LOG_DIR}/yanp-nas-access.log combined
</VirtualHost>
